AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Fracti - AI-powered expense splitting Telegram Mini App with TON settlements.
  Uses Hono framework for clean API routing on AWS Lambda.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Architectures:
      - arm64
    Environment:
      Variables:
        NODE_ENV: !Ref Stage
        TABLE_NAME: !Ref FractiTable
        BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken

Parameters:
  TelegramBotToken:
    Type: String
    Description: Telegram Bot Token from @BotFather
    NoEcho: true
    Default: ''

  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage

Conditions:
  IsProduction: !Equals [!Ref Stage, prod]

Resources:
  #############################################
  # DynamoDB Table (Single Table Design)
  #############################################
  FractiTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub fracti-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI2: Lookup expenses and settlements by ID
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]
      Tags:
        - Key: Application
          Value: Fracti
        - Key: Environment
          Value: !Ref Stage

  #############################################
  # API Gateway (HTTP API)
  #############################################
  FractiApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Description: Fracti API Gateway
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Telegram-Init-Data
          - Authorization
        MaxAge: 86400

  #############################################
  # Lambda Function (Single Hono App)
  #############################################
  FractiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fracti-api-${Stage}
      Description: Fracti API - Hono-based Lambda function
      CodeUri: server/
      Handler: index.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FractiTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet-*'
      Events:
        ApiCatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref FractiApi
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref FractiApi
            Path: /
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Format: esm
        Sourcemap: true
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - index.ts
        External:
          - '@aws-sdk/*'

  #############################################
  # CloudWatch Log Group
  #############################################
  FractiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FractiFunction}
      RetentionInDays: !If [IsProduction, 30, 7]

  #############################################
  # S3 Bucket for Frontend
  #############################################
  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: IsProduction
    Properties:
      BucketName: !Sub fracti-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  #############################################
  # CloudFront Distribution
  #############################################
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: IsProduction
    Properties:
      OriginAccessControlConfig:
        Name: !Sub fracti-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: IsProduction
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontOAC
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsProduction
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${FractiApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
    Export:
      Name: !Sub ${AWS::StackName}-ApiEndpoint

  TelegramWebhookUrl:
    Description: URL to register with Telegram Bot API
    Value: !Sub 'https://${FractiApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/webhooks/telegram'

  TableName:
    Description: DynamoDB table name
    Value: !Ref FractiTable

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt FractiFunction.Arn

  FrontendBucketName:
    Description: S3 bucket for frontend hosting
    Condition: IsProduction
    Value: !Ref FrontendBucket

  CloudFrontDomain:
    Description: CloudFront distribution domain
    Condition: IsProduction
    Value: !GetAtt FrontendDistribution.DomainName
