AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Fracti - AI-powered expense splitting Telegram Mini App with TON settlements.
  Uses Hono framework for clean API routing on AWS Lambda.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Architectures:
      - arm64
    Tracing: Active  # Enable X-Ray tracing
    Environment:
      Variables:
        NODE_ENV: !Ref Stage
        TABLE_NAME: !Ref FractiTable
        S3_BUCKET_NAME: !Ref AvatarsBucket
        BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        AWS_XRAY_SDK_ENABLED: 'true'  # Enable X-Ray SDK

Parameters:
  TelegramBotToken:
    Type: String
    Description: Telegram Bot Token from @BotFather
    NoEcho: true
    Default: ''

  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage

Conditions:
  IsProduction: !Equals [!Ref Stage, prod]

Resources:
  #############################################
  # DynamoDB Table (Single Table Design)
  #############################################
  FractiTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub fracti-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI2: Lookup expenses and settlements by ID
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]
      Tags:
        - Key: Application
          Value: Fracti
        - Key: Environment
          Value: !Ref Stage

  #############################################
  # API Gateway (HTTP API)
  #############################################
  FractiApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Description: Fracti API Gateway
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Telegram-Init-Data
          - Authorization
        MaxAge: 86400

  #############################################
  # Lambda Function (Single Hono App)
  #############################################
  FractiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fracti-api-${Stage}
      Description: Fracti API - Hono-based Lambda function
      CodeUri: server/
      Handler: index.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FractiTable
        - S3CrudPolicy:
            BucketName: !Ref AvatarsBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet-*'
            # X-Ray permissions
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
                - xray:GetSamplingStatisticSummaries
              Resource: '*'
      Events:
        ApiCatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref FractiApi
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref FractiApi
            Path: /
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Format: esm
        Sourcemap: true
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - index.ts
        External:
          - '@aws-sdk/*'

  #############################################
  # S3 Bucket for User Avatars
  #############################################
  AvatarsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub fracti-avatars-${AWS::AccountId}-${Stage}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 86400
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldAvatars
            Status: Enabled
            ExpirationInDays: 365
      Tags:
        - Key: Application
          Value: Fracti
        - Key: Environment
          Value: !Ref Stage

  AvatarsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AvatarsBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${AvatarsBucket.Arn}/*

  #############################################
  # CloudWatch Log Group
  #############################################
  FractiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FractiFunction}
      RetentionInDays: !If [IsProduction, 30, 7]

  #############################################
  # CloudWatch Alarms (Production Only)
  #############################################

  # Lambda Error Rate Alarm
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub fracti-${Stage}-lambda-errors
      AlarmDescription: Triggers when Lambda error rate exceeds threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300  # 5 minutes
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref FractiFunction
      TreatMissingData: notBreaching

  # Lambda Duration Alarm (P99 latency)
  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub fracti-${Stage}-lambda-duration
      AlarmDescription: Triggers when Lambda P99 duration exceeds 10 seconds
      MetricName: Duration
      Namespace: AWS/Lambda
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10000  # 10 seconds in ms
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref FractiFunction
      TreatMissingData: notBreaching

  # Lambda Throttling Alarm
  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub fracti-${Stage}-lambda-throttles
      AlarmDescription: Triggers when Lambda is being throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref FractiFunction
      TreatMissingData: notBreaching

  # DynamoDB Throttled Requests Alarm
  DynamoDBThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub fracti-${Stage}-dynamodb-throttles
      AlarmDescription: Triggers when DynamoDB requests are throttled
      MetricName: ThrottledRequests
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref FractiTable
      TreatMissingData: notBreaching

  # DynamoDB User Errors Alarm (4xx errors)
  DynamoDBUserErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub fracti-${Stage}-dynamodb-user-errors
      AlarmDescription: Triggers when DynamoDB user error rate is high
      MetricName: UserErrors
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref FractiTable
      TreatMissingData: notBreaching

  # API Gateway 5xx Error Alarm
  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub fracti-${Stage}-api-5xx-errors
      AlarmDescription: Triggers when API Gateway 5xx error rate is high
      MetricName: 5xx
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiId
          Value: !Ref FractiApi
        - Name: Stage
          Value: !Ref Stage
      TreatMissingData: notBreaching

  # API Gateway Latency Alarm (P95)
  ApiGatewayLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub fracti-${Stage}-api-latency
      AlarmDescription: Triggers when API Gateway P95 latency exceeds 5 seconds
      MetricName: Latency
      Namespace: AWS/ApiGateway
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5000  # 5 seconds in ms
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiId
          Value: !Ref FractiApi
        - Name: Stage
          Value: !Ref Stage
      TreatMissingData: notBreaching

  #############################################
  # S3 Bucket for Frontend
  #############################################
  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: IsProduction
    Properties:
      BucketName: !Sub fracti-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  #############################################
  # CloudFront Distribution
  #############################################
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: IsProduction
    Properties:
      OriginAccessControlConfig:
        Name: !Sub fracti-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: IsProduction
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontOAC
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsProduction
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${FractiApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
    Export:
      Name: !Sub ${AWS::StackName}-ApiEndpoint

  TelegramWebhookUrl:
    Description: URL to register with Telegram Bot API
    Value: !Sub 'https://${FractiApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/webhooks/telegram'

  TableName:
    Description: DynamoDB table name
    Value: !Ref FractiTable

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt FractiFunction.Arn

  FrontendBucketName:
    Description: S3 bucket for frontend hosting
    Condition: IsProduction
    Value: !Ref FrontendBucket

  CloudFrontDomain:
    Description: CloudFront distribution domain
    Condition: IsProduction
    Value: !GetAtt FrontendDistribution.DomainName

  AvatarsBucketName:
    Description: S3 bucket for user avatars
    Value: !Ref AvatarsBucket

  AvatarsBucketUrl:
    Description: S3 bucket URL for avatars
    Value: !Sub 'https://${AvatarsBucket}.s3.${AWS::Region}.amazonaws.com'
