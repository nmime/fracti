# ===========================================
# Fracti Apps - Docker Compose
# ===========================================
# Application services: web, server, bot
#
# Usage:
#   # Start infrastructure first
#   docker-compose -f docker-compose.infra.yml up -d
#
#   # Then start apps
#   docker-compose up -d
#
# Or run everything together:
#   docker-compose -f docker-compose.infra.yml -f docker-compose.yml up -d

services:
  # ===========================================
  # Frontend
  # ===========================================

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
      - VITE_TONCONNECT_MANIFEST_URL=/tonconnect-manifest.json
    depends_on:
      - server
    networks:
      - fracti-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/app', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # API Server
  # ===========================================

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Database
      - TABLE_NAME=${TABLE_NAME:-fracti-table}
      - DB_ENDPOINT=http://dynamodb:8000
      # Storage
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-fracti-avatars}
      - S3_ENDPOINT=http://minio:9000
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - MINI_APP_URL=${MINI_APP_URL}
      - APP_URL=${APP_URL:-http://localhost}
      # CORS
      - ALLOWED_ORIGINS=${APP_URL:-http://localhost},https://t.me,https://web.telegram.org,http://localhost:3000
      # AI Provider: anthropic | g4f (free, no key needed)
      - AI_PROVIDER=${AI_PROVIDER:-g4f}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      # G4F config (free AI - https://g4f.dev)
      - G4F_BASE_URL=${G4F_BASE_URL:-https://api.g4f.dev/v1}
      - G4F_MODEL=${G4F_MODEL:-gpt-4o-mini}
      # TON Blockchain
      - TONCENTER_API_KEY=${TONCENTER_API_KEY:-}
      - TONCENTER_API_URL=https://toncenter.com/api/v2
      - SKIP_TON_VERIFICATION=${SKIP_TON_VERIFICATION:-false}
      # AWS credentials (dummy for local)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    networks:
      - fracti-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # Telegram Bot
  # ===========================================

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
      target: production
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Database
      - TABLE_NAME=${TABLE_NAME:-fracti-table}
      - DB_ENDPOINT=http://dynamodb:8000
      # Storage
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-fracti-avatars}
      - S3_ENDPOINT=http://minio:9000
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - MINI_APP_URL=${MINI_APP_URL}
      - APP_URL=${APP_URL:-http://localhost}
      # AI Provider: anthropic | g4f (free, no key needed)
      - AI_PROVIDER=${AI_PROVIDER:-g4f}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      # G4F config (free AI - https://g4f.dev)
      - G4F_BASE_URL=${G4F_BASE_URL:-https://api.g4f.dev/v1}
      - G4F_MODEL=${G4F_MODEL:-gpt-4o-mini}
      # AWS credentials (dummy for local)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    networks:
      - fracti-network

# ===========================================
# Network (shared with infra)
# ===========================================

networks:
  fracti-network:
    external: true
    name: fracti_fracti-network
